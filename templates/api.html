<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    {{template "navbar" .User}}

    <div class="container mt-4">
        <div id="message" class="alert d-none"></div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Add via API</h5>
                    </div>
                    <div class="card-body">
                        <form id="addForm">
                            <div class="mb-3">
                                <label for="nim" class="form-label">NIM</label>
                                <input type="text" class="form-control" id="nim" required>
                            </div>
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="major" class="form-label">Major</label>
                                <select class="form-select" id="major" required></select>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success">POST /api/students</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">GET /api/students</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-bordered table-striped align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>NIM</th>
                                    <th>Name</th>
                                    <th>Major</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="rows"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // One helper for every API call.
        async function api(method, url, body) {
            const res = await fetch(url, {
                method: method,
                headers: { "Content-Type": "application/json" },
                body: body ? JSON.stringify(body) : undefined,
            });

            const data = res.status === 204 ? null : await res.json();

            if (!res.ok) throw new Error(res.status + " " + data.error);

            return data;
        }

        function show(text, ok) {
            const box = document.getElementById("message");
            box.textContent = text;
            box.className = "alert " + (ok ? "alert-success" : "alert-danger");
        }

        function cell(tr, text) {
            const td = document.createElement("td");
            td.textContent = text;
            tr.appendChild(td);
        }

        async function loadStudents() {
            const students = await api("GET", "/api/students");
            const tbody = document.getElementById("rows");

            tbody.replaceChildren();

            for (const s of students) {
                const tr = document.createElement("tr");

                cell(tr, s.id);
                cell(tr, s.nim);
                cell(tr, s.name);
                cell(tr, s.major);

                const td = document.createElement("td");
                const btn = document.createElement("button");

                btn.className = "btn btn-danger btn-sm";
                btn.textContent = "DELETE";
                btn.onclick = () => removeStudent(s.id);

                td.appendChild(btn);
                tr.appendChild(td);
                tbody.appendChild(tr);
            }
        }

        async function removeStudent(id) {
            try {
                await api("DELETE", "/api/students/" + id);

                show("Deleted student " + id + " (204 No Content).", true);
                loadStudents();
            } catch (e) {
                show(e.message, false);
            }
        }

        async function loadMajors() {
            const majors = await api("GET", "/api/majors");
            const select = document.getElementById("major");

            for (const m of majors) {
                select.add(new Option(m.name, m.id));
            }
        }

        document.getElementById("addForm").onsubmit = async (e) => {
            e.preventDefault();

            try {
                const created = await api("POST", "/api/students", {
                    nim: document.getElementById("nim").value,
                    name: document.getElementById("name").value,
                    major_id: Number(document.getElementById("major").value),
                });

                show("Created student " + created.id + " (201 Created).", true);
                e.target.reset();
                loadStudents();
            } catch (err) {
                show(err.message, false);
            }
        };

        loadMajors();
        loadStudents();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
