<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    {{template "navbar" .User}}

    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Student Management</h4>
                <a href="/create" class="btn btn-success btn-sm">+ Add Student</a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>No</th>
                                <th>NIM</th>
                                <th>Name</th>
                                <th>Major</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {{range $i, $s := .Students}}
                            <tr>
                                <td>{{inc $i}}</td>
                                <td>{{$s.NIM}}</td>
                                <td>{{$s.Name}}</td>
                                <td>{{$s.MajorName}}</td>
                                <td class="text-center">
                                    <a href="/edit?id={{$s.ID}}" class="btn btn-warning btn-sm">Edit</a>
                                    {{if $.User.IsAdmin}}
                                    <form method="POST" action="/delete?id={{$s.ID}}" class="d-inline"
                                        onsubmit="return confirm('Are you sure you want to delete this student?')">
                                        <input type="hidden" name="csrf" value="{{$.User.CSRF}}">
                                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                    </form>
                                    {{end}}
                                </td>
                            </tr>
                            {{else}}
                            <tr>
                                <td colspan="5" class="text-center text-muted">No students yet.</td>
                            </tr>
                            {{end}}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
</body>

</html>
